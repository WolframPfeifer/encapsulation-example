name: container build

on:
  push:
    branches: [main,docker]

env:
  REGISTRY_IMAGE: wolframpfeifer/encapsulation

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # When/If native linux/arm64 runners become available on the free plan,
          # this can be updated to choose the corresponding image...
          - platform: linux/amd64
            cachetag: linux-amd64
            os: ubuntu-latest
          - platform: linux/arm64
            cachetag: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Not enough space on ARM
#      - name: Remove unnecessary files
#        run: |
#          sudo rm -rf /usr/share/dotnet
#          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: "{{defaultContext}}:contents/"
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.cachetag }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.cachetag }},mode=max
      
#      - name: Export digest
#        run: |
#          mkdir -p /tmp/digests
#          digest="${{ steps.build.outputs.digest }}"
#          touch "/tmp/digests/${digest#sha256:}"
      
#      - name: Upload digest
#        uses: actions/upload-artifact@v4
#        with:
#          name: digests-${{ env.PLATFORM_PAIR }}
#          path: /tmp/digests/*
#          if-no-files-found: error
#          retention-days: 1
